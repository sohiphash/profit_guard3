                      selectedIcon: Icon(Icons.subscriptions),
                      label: 'الاشتراكات',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.admin_panel_settings_outlined),
                      selectedIcon: Icon(Icons.admin_panel_settings),
                      label: 'المطور',
                    ),
                  ],
                ),
              );
            }
          }
