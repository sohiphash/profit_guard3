                serviceName: 'استضافة وخوادم سحابية',
                totalQuota: 50,
                usedQuota: 15,
                renewalDate: '2026-12-10',
                monthlyCost: 12.0,
              ),
            ];

            double get totalMonthlyCost {
              return _items.fold(0.0, (sum, item) => sum + item.monthlyCost);
            }

