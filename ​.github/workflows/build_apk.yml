          class _SubscriptionsSummaryScreenState
              extends State<SubscriptionsSummaryScreen> {
            final List<SubscriptionItem> _items = [
              SubscriptionItem(
                id: 's1',
                serviceName: 'باقة أدوات الذكاء الاصطناعي',
                totalQuota: 100,
                usedQuota: 82,
                renewalDate: '2026-12-01',
                monthlyCost: 20.0,
              ),
              SubscriptionItem(
