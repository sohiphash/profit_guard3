name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create android folder and project files
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

          mkdir -p lib/models lib/screens lib/widgets

          cat << 'EOF' > lib/models/payment_item.dart
          class PaymentItem {
            final String id;
            final String clientName;
            final String serviceTitle;
            final double amount;
            final String dueDate;
            final int previousDelays;
            bool isCollected;

            PaymentItem({
              required this.id,
              required this.clientName,
              required this.serviceTitle,
              required this.amount,
              required this.dueDate,
              required this.previousDelays,
              this.isCollected = false,
            });

            String get riskLevel {
              if (previousDelays == 0) return 'ملتزم';
              if (previousDelays == 1) return 'تنبيه متوسط';
              return 'مخاطرة عالية';
            }
          }
          EOF

          cat << 'EOF' > lib/models/subscription_item.dart
          class SubscriptionItem {
            final String id;
            final String serviceName;
            final int totalQuota;
            int usedQuota;
            final String renewalDate;
            final double monthlyCost;

            SubscriptionItem({
              required this.id,
              required this.serviceName,
              required this.totalQuota,
              required this.usedQuota,
              required this.renewalDate,
              required this.monthlyCost,
            });

            int get remainingQuota {
              final diff = totalQuota - usedQuota;
              return diff < 0 ? 0 : diff;
            }

            double get usageRatio {
              if (totalQuota <= 0) return 0.0;
              return (usedQuota / totalQuota).clamp(0.0, 1.0);
            }
          }
          EOF

          cat << 'EOF' > lib/widgets/summary_card.dart
          import 'package:flutter/material.dart';

          class SummaryCard extends StatelessWidget {
            final String title;
            final String value;
            final Color backgroundColor;
            final Color valueColor;

            const SummaryCard({
              super.key,
              required this.title,
              required this.value,
              required this.backgroundColor,
              required this.valueColor,
            });

            @override
            Widget build(BuildContext context) {
              return Card(
                color: backgroundColor,
                elevation: 0,
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                child: Padding(
                  padding: const EdgeInsets.all(14),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        title,
                        style: const TextStyle(fontSize: 13, fontWeight: FontWeight.w500),
                      ),
                      const SizedBox(height: 8),
                      Text(
                        value,
                        style: TextStyle(
