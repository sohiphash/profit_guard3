            }
          }
          EOF

          cat << 'EOF' > lib/screens/cashflow_screen.dart
          import 'package:flutter/material.dart';
          import '../models/payment_item.dart';
          import '../widgets/summary_card.dart';

          class CashflowScreen extends StatefulWidget {
            const CashflowScreen({super.key});

            @override
            State<CashflowScreen> createState() => _CashflowScreenState();
          }

          class _CashflowScreenState extends State<CashflowScreen> {
            double actualCash = 420.0;

            final List<PaymentItem> _payments = [
              PaymentItem(
                id: '1',
                clientName: 'أحمد العلي',
                serviceTitle: 'دفعة متبقية - تصميم هوية',
                amount: 150.0,
                dueDate: '2026-11-22',
                previousDelays: 0,
              ),
              PaymentItem(
                id: '2',
                clientName: 'شركة النور',
                serviceTitle: 'قسط طلبية منتجات',
                amount: 280.0,
                dueDate: '2026-11-18',
                previousDelays: 2,
              ),
            ];

            double get pendingCash {
              return _payments
                  .where((item) => !item.isCollected)
                  .fold(0.0, (sum, item) => sum + item.amount);
            }

            void _collectPayment(PaymentItem item) {
              if (item.isCollected) return;
              setState(() {
                item.isCollected = true;
                actualCash += item.amount;
              });
            }

            void _openAddPaymentDialog() {
              final clientController = TextEditingController();
              final titleController = TextEditingController();
              final amountController = TextEditingController();
              final dateController = TextEditingController(text: '2026-11-25');
              int delays = 0;

              showDialog(
                context: context,
                builder: (context) {
                  return StatefulBuilder(
                    builder: (context, setDialogState) {
                      return AlertDialog(
                        title: const Text('إضافة دفعة مجدولة'),
                        content: SingleChildScrollView(
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              TextField(
                                controller: clientController,
                                decoration: const InputDecoration(labelText: 'اسم العميل'),
                              ),
                              TextField(
                                controller: titleController,
                                decoration: const InputDecoration(labelText: 'وصف الخدمة أو الطلب'),
                              ),
                              TextField(
                                controller: amountController,
                                keyboardType: TextInputType.number,
                                decoration: const InputDecoration(labelText: 'المبلغ المستحق'),
                              ),
                              TextField(
                                controller: dateController,
                                decoration: const InputDecoration(labelText: 'تاريخ الاستحقاق (YYYY-MM-DD)'),
                              ),
                              const SizedBox(height: 12),
                              Row(
                                mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                children: [
                                  const Text('تأخيرات سابقة:'),
                                  DropdownButton<int>(
                                    value: delays,
                                    items: [0, 1, 2, 3]
                                        .map((d) => DropdownMenuItem(value: d, child: Text('$d')))
                                        .toList(),
                                    onChanged: (val) {
                                      if (val != null) {
                                        setDialogState(() => delays = val);
                                      }
                                    },
                                  ),
                                ],
                              ),
                            ],
                          ),
                        ),
                        actions: [
                          TextButton(
                            onPressed: () => Navigator.pop(context),
                            child: const Text('إلغاء'),
                          ),
                          FilledButton(
                            onPressed: () {
                              final amount = double.tryParse(amountController.text.trim()) ?? 0;
                              if (clientController.text.trim().isEmpty || amount <= 0) return;

                              setState(() {
                                _payments.insert(
                                  0,
                                  PaymentItem(
                                    id: DateTime.now().millisecondsSinceEpoch.toString(),
                                    clientName: clientController.text.trim(),
                                    serviceTitle: titleController.text.trim().isEmpty
                                        ? 'دفعة مجدولة'
                                        : titleController.text.trim(),
                                    amount: amount,
                                    dueDate: dateController.text.trim(),
                                    previousDelays: delays,
                                  ),
                                );
                              });
                              Navigator.pop(context);
                            },
                            child: const Text('حفظ'),
                          ),
                        ],
                      );
                    },
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('إدارة الأرباح والدفعات'),
                  centerTitle: true,
                ),
                floatingActionButton: FloatingActionButton.extended(
                  onPressed: _openAddPaymentDialog,
                  icon: const Icon(Icons.add),
                  label: const Text('دفعة مجدولة'),
                ),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      Row(
                        children: [
                          Expanded(
                            child: SummaryCard(
                              title: 'الكاش الفعلي الآن',
                              value: actualCash.toStringAsFixed(2),
                              backgroundColor: Colors.teal.shade50,
                              valueColor: Colors.teal.shade800,
                            ),
                          ),
                          const SizedBox(width: 12),
                          Expanded(
                            child: SummaryCard(
                              title: 'أرباح معلقة (مجدولة)',
                              value: pendingCash.toStringAsFixed(2),
                              backgroundColor: Colors.amber.shade50,
                              valueColor: Colors.orange.shade800,
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 18),
                      const Text(
                        'الدفعات المجدولة ورادار الالتزام',
                        style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                      ),
                      const SizedBox(height: 8),
                      Expanded(
                        child: ListView.builder(
                          itemCount: _payments.length,
                          itemBuilder: (context, index) {
                            final item = _payments[index];
                            final isHighRisk = item.previousDelays > 0;

                            return Card(
                              margin: const EdgeInsets.only(bottom: 10),
                              child: ListTile(
                                title: Text('${item.clientName} — ${item.amount.toStringAsFixed(2)}'),
                                subtitle: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Text('${item.serviceTitle} | الموعد: ${item.dueDate}'),
                                    const SizedBox(height: 4),
                                    Text(
                                      'الرادار: ${item.riskLevel} (${item.previousDelays} تأخيرات سابقة)',
                                      style: TextStyle(
                                        fontSize: 12,
                                        fontWeight: FontWeight.w600,
                                        color: isHighRisk ? Colors.red.shade700 : Colors.green.shade700,
                                      ),
                                    ),
                                  ],
                                ),
                                trailing: item.isCollected
                                    ? const Chip(label: Text('مُحصّل'))
                                    : FilledButton(
                                        onPressed: () => _collectPayment(item),
                                        child: const Text('تحصيل'),
                                      ),
                              ),
                            );
                          },
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          cat << 'EOF' > lib/screens/pricing_calculator_screen.dart
          import 'package:flutter/material.dart';
          import '../widgets/summary_card.dart';

          class PricingCalculatorScreen extends StatefulWidget {
            const PricingCalculatorScreen({super.key});

            @override
            State<PricingCalculatorScreen> createState() => _PricingCalculatorScreenState();
          }

          class _PricingCalculatorScreenState extends State<PricingCalculatorScreen> {
            final _costController = TextEditingController(text: '50');
            final _extraCostController = TextEditingController(text: '10');
            final _marginController = TextEditingController(text: '30');
            final _offeredPriceController = TextEditingController(text: '65');

            double _minSafePrice = 60.0;
            double _suggestedPrice = 78.0;
            double _expectedProfit = 5.0;
            bool _isLossWarning = false;

            void _calculatePricing() {
              final directCost = double.tryParse(_costController.text.trim()) ?? 0.0;
              final extraCost = double.tryParse(_extraCostController.text.trim()) ?? 0.0;
              final marginPercent = double.tryParse(_marginController.text.trim()) ?? 0.0;
              final offeredPrice = double.tryParse(_offeredPriceController.text.trim()) ?? 0.0;

              final totalCost = directCost + extraCost;
              final safeMargin = marginPercent.clamp(0.0, 95.0);
              final suggested = totalCost * (1 + (safeMargin / 100));
              final profitAtOffered = offeredPrice - totalCost;

              setState(() {
                _minSafePrice = totalCost;
                _suggestedPrice = suggested;
                _expectedProfit = profitAtOffered;
                _isLossWarning = offeredPrice < totalCost;
              });
            }

            @override
            void initState() {
              super.initState();
              _calculatePricing();
            }

            @override
            void dispose() {
              _costController.dispose();
              _extraCostController.dispose();
              _marginController.dispose();
              _offeredPriceController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('حاسبة التسعير ومنع الخسارة'),
                  centerTitle: true,
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      TextField(
                        controller: _costController,
                        keyboardType: TextInputType.number,
                        decoration: const InputDecoration(
                          labelText: 'تكلفة الخامات أو الخدمة الأساسية',
                          border: OutlineInputBorder(),
                        ),
                        onChanged: (_) => _calculatePricing(),
                      ),
                      const SizedBox(height: 12),
                      TextField(
                        controller: _extraCostController,
                        keyboardType: TextInputType.number,
                        decoration: const InputDecoration(
                          labelText: 'تكاليف تشغيل إضافية (شحن، أدوات، رسوم)',
                          border: OutlineInputBorder(),
                        ),
                        onChanged: (_) => _calculatePricing(),
                      ),
                      const SizedBox(height: 12),
                      Row(
                        children: [
                          Expanded(
                            child: TextField(
                              controller: _marginController,
                              keyboardType: TextInputType.number,
                              decoration: const InputDecoration(
                                labelText: 'نسبة الربح المطلوبة (%)',
                                border: OutlineInputBorder(),
                              ),
                              onChanged: (_) => _calculatePricing(),
                            ),
                          ),
                          const SizedBox(width: 12),
                          Expanded(
                            child: TextField(
                              controller: _offeredPriceController,
                              keyboardType: TextInputType.number,
                              decoration: const InputDecoration(
                                labelText: 'السعر الذي تفكر بالبيع به',
                                border: OutlineInputBorder(),
                              ),
                              onChanged: (_) => _calculatePricing(),
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 16),
                      Row(
                        children: [
                          Expanded(
                            child: SummaryCard(
                              title: 'الحد الأدنى (منع الخسارة)',
                              value: _minSafePrice.toStringAsFixed(2),
                              backgroundColor: Colors.red.shade50,
                              valueColor: Colors.red.shade800,
                            ),
                          ),
                          const SizedBox(width: 12),
                          Expanded(
                            child: SummaryCard(
                              title: 'السعر المقترح للبيع',
                              value: _suggestedPrice.toStringAsFixed(2),
                              backgroundColor: Colors.teal.shade50,
                              valueColor: Colors.teal.shade800,
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 12),
                      Card(
                        color: _isLossWarning ? Colors.red.shade100 : Colors.green.shade50,
                        child: Padding(
                          padding: const EdgeInsets.all(14),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text(
                                _isLossWarning
                                    ? 'تحذير: هذا السعر أقل من التكلفة وستخسر فعلياً!'
                                    : 'الربح المتوقع عند السعر المدخل: ${_expectedProfit.toStringAsFixed(2)}',
                                style: TextStyle(
                                  fontSize: 15,
                                  fontWeight: FontWeight.bold,
                                  color: _isLossWarning ? Colors.red.shade900 : Colors.green.shade900,
                                ),
                              ),
                              const SizedBox(height: 4),
                              Text(
                                _isLossWarning
                                    ? 'ارفع السعر فوق ${_minSafePrice.toStringAsFixed(2)} لتفادي الخسارة المباشرة.'
                                    : 'السعر يغطي التكاليف ويوفر هامشاً إيجابياً.',
                                style: const TextStyle(fontSize: 13),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

