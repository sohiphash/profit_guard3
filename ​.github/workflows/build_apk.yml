          cat << 'EOF' > lib/screens/developer_admin_screen.dart
          import 'package:flutter/material.dart';
          import '../widgets/summary_card.dart';

          class _SentCampaign {
            final String title;
            final String segmentLabel;
            final String message;

            _SentCampaign({
              required this.title,
              required this.segmentLabel,
              required this.message,
            });
          }

          class DeveloperAdminScreen extends StatefulWidget {
            const DeveloperAdminScreen({super.key});

            @override
            State<DeveloperAdminScreen> createState() => _DeveloperAdminScreenState();
          }

          class _DeveloperAdminScreenState extends State<DeveloperAdminScreen> {
            bool _isMaintenanceMode = false;

            final _proPriceController = TextEditingController(text: '9.99');
            double _currentProPrice = 9.99;

            String _selectedSegment = 'expired';
            final _titleController = TextEditingController();
            final _messageController = TextEditingController();

            final Map<String, String> _segments = const {
              'expired': 'المنتهي اشتراكهم',
              'free': 'مستخدمو الباقة المجانية',
              'active_paid': 'المشتركون النشطون',
              'all': 'جميع المستخدمين',
            };

            final Map<String, int> _segmentCounts = const {
              'expired': 18,
              'free': 64,
              'active_paid': 29,
              'all': 111,
            };

            final List<_SentCampaign> _campaignsHistory = [];

            void _updatePlanPrice() {
              final parsed = double.tryParse(_proPriceController.text.trim());
              if (parsed == null || parsed <= 0) return;

              setState(() {
                _currentProPrice = parsed;
              });

              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text('تم تحديث سعر باقة Pro إلى ${_currentProPrice.toStringAsFixed(2)}'),
                ),
              );
            }

            void _sendBulkCampaign() {
              final title = _titleController.text.trim();
              final msg = _messageController.text.trim();
              if (title.isEmpty || msg.isEmpty) return;

              final segmentLabel = _segments[_selectedSegment] ?? 'فئة محددة';
              final recipients = _segmentCounts[_selectedSegment] ?? 0;

              setState(() {
                _campaignsHistory.insert(
                  0,
                  _SentCampaign(
                    title: title,
                    segmentLabel: segmentLabel,
                    message: msg,
                  ),
                );
                _titleController.clear();
                _messageController.clear();
              });

              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text('تم إرسال الرسالة لفئة ($segmentLabel) إلى $recipients مستخدم'),
                ),
              );
            }

            @override
            void dispose() {
              _proPriceController.dispose();
              _titleController.dispose();
              _messageController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final activeSegmentCount = _segmentCounts[_selectedSegment] ?? 0;

              return Scaffold(
                appBar: AppBar(
                  title: const Text('لوحة تحكم المطور'),
                  centerTitle: true,
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      Row(
                        children: [
                          Expanded(
                            child: SummaryCard(
                              title: 'حالة التطبيق',
                              value: _isMaintenanceMode ? 'صيانة (متوقف)' : 'نشط للمستخدمين',
                              backgroundColor:
                                  _isMaintenanceMode ? Colors.red.shade50 : Colors.green.shade50,
                              valueColor:
                                  _isMaintenanceMode ? Colors.red.shade800 : Colors.green.shade800,
                            ),
                          ),
                          const SizedBox(width: 12),
                          Expanded(
                            child: SummaryCard(
                              title: 'سعر باقة Pro',
                              value: _currentProPrice.toStringAsFixed(2),
                              backgroundColor: Colors.blue.shade50,
                              valueColor: Colors.blue.shade800,
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 16),
                      Card(
                        child: SwitchListTile(
                          title: const Text(
                            'مفتاح وضع الصيانة (Kill-Switch)',
                            style: TextStyle(fontWeight: FontWeight.bold),
                          ),
                          subtitle: Text(
                            _isMaintenanceMode
                                ? 'التطبيق الآن في وضع الصيانة ويعرض شاشة تنبيه للمستخدمين.'
                                : 'التطبيق يعمل بشكل طبيعي لجميع المستخدمين.',
                          ),
                          value: _isMaintenanceMode,
                          onChanged: (val) {
                            setState(() => _isMaintenanceMode = val);
                          },
                        ),
                      ),
                      const SizedBox(height: 14),
                      Card(
                        child: Padding(
                          padding: const EdgeInsets.all(14),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              const Text(
                                'إدارة تسعير الباقات',
                                style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold),
                              ),
                              const SizedBox(height: 10),
                              Row(
                                children: [
                                  Expanded(
                                    child: TextField(
                                      controller: _proPriceController,
                                      keyboardType: TextInputType.number,
                                      decoration: const InputDecoration(
                                        labelText: 'سعر الاشتراك الشهري (Pro)',
                                        border: OutlineInputBorder(),
                                      ),
                                    ),
                                  ),
                                  const SizedBox(width: 10),
                                  FilledButton(
                                    onPressed: _updatePlanPrice,
                                    child: const Text('حفظ السعر'),
                                  ),
                                ],
                              ),
                            ],
                          ),
                        ),
                      ),
                      const SizedBox(height: 14),
                      Card(
                        child: Padding(
                          padding: const EdgeInsets.all(14),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              const Text(
                                'رسالة جماعية حسب الفئة',
                                style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold),
                              ),
                              const SizedBox(height: 10),
                              DropdownButtonFormField<String>(
                                value: _selectedSegment,
                                decoration: const InputDecoration(
                                  labelText: 'اختر الفئة المستهدفة',
                                  border: OutlineInputBorder(),
                                ),
                                items: _segments.entries
                                    .map(
                                      (entry) => DropdownMenuItem<String>(
                                        value: entry.key,
                                        child: Text(entry.value),
                                      ),
                                    )
                                    .toList(),
                                onChanged: (val) {
                                  if (val != null) {
                                    setState(() => _selectedSegment = val);
                                  }
                                },
                              ),
                              const SizedBox(height: 10),
                              TextField(
                                controller: _titleController,
                                decoration: const InputDecoration(
                                  labelText: 'عنوان التنبيه (مثال: انتهى اشتراكك أو عرض تجديد)',
                                  border: OutlineInputBorder(),
                                ),
                              ),
                              const SizedBox(height: 10),
                              TextField(
                                controller: _messageController,
                                maxLines: 3,
                                decoration: const InputDecoration(
                                  labelText: 'نص الرسالة الموجهة للفئة',
                                  border: OutlineInputBorder(),
                                ),
                              ),
                              const SizedBox(height: 12),
                              Row(
                                mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                children: [
                                  Text(
                                    'المستهدفون: $activeSegmentCount مستخدم',
                                    style: const TextStyle(
                                      fontSize: 12,
                                      fontWeight: FontWeight.w600,
                                    ),
                                  ),
                                  FilledButton.icon(
                                    onPressed: _sendBulkCampaign,
                                    icon: const Icon(Icons.send),
                                    label: const Text('إرسال للفئة'),
                                  ),
                                ],
                              ),
                            ],
                          ),
                        ),
                      ),
                      if (_campaignsHistory.isNotEmpty) ...[
                        const SizedBox(height: 16),
                        const Text(
                          'سجل الرسائل الجماعية المرسلة',
                          style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold),
                        ),
                        const SizedBox(height: 8),
                        ..._campaignsHistory.map(
                          (camp) => Card(
                            margin: const EdgeInsets.only(bottom: 8),
                            child: ListTile(
                              title: Text('${camp.title} (${camp.segmentLabel})'),
                              subtitle: Text(camp.message),
                            ),
                          ),
                        ),
                      ],
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'screens/cashflow_screen.dart';
          import 'screens/pricing_calculator_screen.dart';
          import 'screens/subscriptions_summary_screen.dart';
