      - name: Update Gradle and Android build config
        run: |
          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\\/\\/services.gradle.org\\/distributions\\/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          if [ -f android/build.gradle ]; then
            sed -i "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.3.2/" android/build.gradle
          fi
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "com.android.application" version "[0-9.]*"/id "com.android.application" version "8.3.2"/' android/settings.gradle
            sed -i 's/id "org.jetbrains.kotlin.android" version "[0-9.]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: profit-guard-apk
          path: build/app/outputs/flutter-apk/app-release.apk
